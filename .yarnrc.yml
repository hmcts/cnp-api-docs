compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# The Yarn release is committed, so yarnPath is the single source of truth for
# which Yarn runs. Deliberately no `packageManager` field in package.json: it
# takes precedence over yarnPath and makes Corepack re-download an identical Yarn
# from the network on every CI run.
yarnPath: .yarn/releases/yarn-4.10.3.cjs

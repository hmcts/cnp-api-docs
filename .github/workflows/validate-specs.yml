name: Validate API specs

# Publishers push straight to master, so this cannot gate ingest. It guards the
# spec filenames that other services depend on, and reports registry health.
#
# It deliberately does not track or report individual broken specs. Detecting
# them changed nothing: the owning team's publishing job is what breaks, and this
# repo cannot fix or usefully nag about it. A broken spec shows up in the registry
# health report like any other.

on:
  push:
    branches: [master]
    paths: ['docs/specs/**']
  pull_request:
    # Includes this file: without it, a change to the workflow gets no checks.
    paths:
      - 'docs/specs/**'
      - 'bin/validate-specs.mjs'
      - '.github/workflows/validate-specs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit-test the validator
        run: node --test test/validate-specs.test.mjs

      # Guards the spec filenames that XUI fetches at runtime, that the CCD/HMC
      # F-125 tests assert on, and that terraform reads at apply time.
      - name: Check externally-consumed specs are intact
        run: node --test test/consumer-contract.test.mjs

      - name: Report registry health
        run: node bin/validate-specs.mjs || true

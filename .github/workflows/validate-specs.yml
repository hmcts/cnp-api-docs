name: Validate API specs

# Publishers push straight to master, so a required status check cannot gate
# ingest. This runs after the push and reports a spec that used to parse and no
# longer does. It does not repair it: the owning team's pipeline is what is
# broken, and restoring the old file here only hides that.

on:
  push:
    branches: [master]
    paths: ['docs/specs/**']
  pull_request:
    # Includes this file: without it, a change to the workflow gets no checks at
    # all, which is how this PR initially reported nothing to review.
    paths:
      - 'docs/specs/**'
      - 'bin/validate-specs.mjs'
      - 'bin/detect-broken-specs.mjs'
      - '.github/workflows/validate-specs.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit-test the validator
        run: node --test test/validate-specs.test.mjs

      # Guards the spec filenames that XUI fetches at runtime, that the CCD/HMC
      # F-125 tests assert on, and that terraform reads at apply time.
      - name: Check externally-consumed specs are intact
        run: node --test test/consumer-contract.test.mjs

      - name: Report registry health
        run: node bin/validate-specs.mjs || true

      - name: Detect newly-broken specs
        id: detect
        run: |
          base='${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'
          node bin/detect-broken-specs.mjs --base "$base" | tee /tmp/broken.json

      - name: Open or update the tracking issue
        if: github.event_name == 'push' && steps.detect.outputs.broken_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Broken API specs are being published"
          body=$(node -e '
            const s = require("/tmp/broken.json");
            const lines = s.brokenInThisPush.map(
              (r) => `- \`${r.path}\` — ${r.reason}` + (r.previousBytes ? ` (was ${r.previousBytes} bytes)` : ""),
            );
            console.log([
              `A spec that previously parsed has been published in a state that does not parse.`,
              ``,
              `Broken by ${process.env.GITHUB_SHA}:`,
              ...lines,
              ``,
              `**This is not repaired automatically.** The owning team needs to fix its publishing job and republish.`,
              ``,
              `The usual cause is the pipeline writing an empty file when it cannot fetch the spec from the running application, which fails silently. Republishing a working spec is the fix; restoring the old file here only hides it.`,
            ].join("\n"));
          ')
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "spec-health" || \
              gh issue create --title "$title" --body "$body"
          fi

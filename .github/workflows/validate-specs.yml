name: Validate API specs

# Publishers push straight to master and the publishing bot bypasses branch
# protection, so a required status check cannot gate ingest. This runs after the
# push and repairs the one unambiguous failure mode: a spec that used to parse
# and no longer does.

on:
  push:
    branches: [master]
    paths: ['docs/specs/**']
  pull_request:
    # Deliberately broad: a narrow filter silently skipped the whole suite on a PR
    # that rewrote the model layer. Anything that can change the registry, the
    # model or the test suite must run it.
    paths:
      - 'docs/specs/**'
      - 'bin/**'
      - 'model/**'
      - 'test/**'
      - 'registry.yaml'
      - 'package.json'
      - '.github/workflows/validate-specs.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Never let two revert jobs race each other onto master.
  group: validate-specs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run the test suite
        run: yarn test

      - name: Build the model
        run: |
          yarn build-model
          if [ -n "$(git status --porcelain docs/specs)" ]; then
            echo "::error::the build modified docs/specs — publishers' bytes must never change" >&2
            git status --porcelain docs/specs >&2
            exit 1
          fi

      - name: Report registry health
        run: node bin/validate-specs.mjs || true

      - name: Detect newly-broken specs (report only)
        if: github.event_name == 'pull_request'
        run: node bin/revert-broken-specs.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Revert newly-broken specs
        if: github.event_name == 'push'
        id: revert
        run: |
          node bin/revert-broken-specs.mjs --base "${{ github.event.before }}" --apply | tee /tmp/revert.json

      # master requires a PR and GITHUB_TOKEN cannot bypass that; the publisher
      # token can. Falls back to opening a PR rather than losing the repair.
      - name: Push the revert
        if: github.event_name == 'push' && (steps.revert.outputs.reverted_count != '0' || steps.revert.outputs.removed_count != '0')
        id: push
        env:
          PUBLISHER_TOKEN: ${{ secrets.SWAGGER_PUBLISHER_API_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all docs/specs
          git commit -m "Repair specs affected by ${GITHUB_SHA:0:7}

          A spec that previously parsed was replaced by one that does not, or a
          bare docs/specs/.json was created by a publisher that could not resolve
          its repo slug."

          if [ -n "$PUBLISHER_TOKEN" ]; then
            git remote set-url origin \
              "https://jenkins-reform-hmcts:${PUBLISHER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin master || break
          done

          echo "direct push rejected; opening a pull request instead" >&2
          echo "pushed=false" >> "$GITHUB_OUTPUT"

      - name: Open a PR if the direct push was rejected
        if: github.event_name == 'push' && steps.push.outputs.pushed == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Repair broken API specs
          title: Repair broken API specs
          body: |
            A spec that previously parsed was published in an unparseable state and
            has been restored automatically. The direct push to `master` was
            rejected by branch protection, so this is a pull request instead.

            Fix the publishing job in the owning repo rather than re-pushing by hand.
          branch: fix/repair-broken-specs
          delete-branch: true
          add-paths: docs/specs

      - name: Open or update the tracking issue
        if: github.event_name == 'push' && steps.revert.outputs.reverted_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Broken API specs are being published"
          body=$(node -e '
            const s = require("/tmp/revert.json");
            const lines = s.reverted.map(r => `- \`${r.path}\` — was ${r.reason}, restored ${r.restoredBytes} bytes`);
            console.log([
              `Specs were published in a state that does not parse, and have been restored automatically.`,
              ``,
              `Broken by ${process.env.GITHUB_SHA}:`,
              ...lines,
              ``,
              `The usual cause is the publishing pipeline writing an empty file when it cannot fetch the spec from the running application, so the failure is silent. Fix the publishing job in the owning repo rather than re-pushing by hand.`,
            ].join("\n"));
          ')
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "spec-health" || \
              gh issue create --title "$title" --body "$body"
          fi

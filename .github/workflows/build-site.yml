name: Build site

# Does not deploy: the Pages source is still master:/docs. Switching Pages to
# "GitHub Actions" is a separate, manual step.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Freshness comes from commit history, so a shallow clone would report
          # every spec as never published.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable

      - name: Build the site
        run: yarn build-site

      - name: Validate and build the architecture diagrams
        run: |
          yarn validate-c4
          yarn build-c4

      - name: Assemble, verifying spec bytes are unchanged
        run: yarn assemble

      # After assembling: the consumer contract and legacy redirect assertions
      # check the built output, and skip themselves without it.
      - name: Test
        run: yarn test

      - name: Re-verify every spec against the source tree
        run: |
          fail=0
          for f in docs/specs/*.json; do
            name=$(basename "$f")
            [ "$name" = ".json" ] && continue
            if ! cmp -s "$f" "build/dist/specs/$name"; then
              echo "::error::$name differs between docs/specs and the built site"
              fail=1
            fi
          done
          # ! -name '.json' on both sides: publishers recreate a bare ".json" when
          # they cannot resolve a repo slug, and it is never a real spec.
          count=$(find build/dist/specs -maxdepth 1 -name '*.json' ! -name '.json' | wc -l)
          expected=$(find docs/specs -maxdepth 1 -name '*.json' ! -name '.json' | wc -l)
          if [ "$count" != "$expected" ]; then
            echo "::error::built site has $count specs, source tree has $expected"
            fail=1
          fi
          echo "verified $count specs byte-identical"
          exit $fail

      - name: Report registry health
        run: yarn validate-specs || true

      - name: Summarise
        run: |
          {
            echo "### Site artifact"
            echo
            echo "- pages: $(find build/dist -name '*.html' | wc -l)"
            echo "- specs served verbatim: $(find build/dist/specs -maxdepth 1 -name '*.json' ! -name '.json' | wc -l)"
            echo "- normalised for rendering: $(find build/dist/specs/_normalised -name '*.json' | wc -l)"
            echo
            echo "Not deployed: the Pages source is still \`master:/docs\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist

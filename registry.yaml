# Facts about CFT services that cannot be derived from their OpenAPI specs:
# group membership, dependency edges, and prose descriptions.
#
# Everything else (title, version, path count, freshness, ownership) is
# derived by model/build.mjs. Adding a service here is NOT required for its
# spec to appear in the portal — every file in docs/specs/ is published.
#
# 'ambient: true' marks ubiquitous infrastructure (auth, S2S). Its inbound
# edges are drawn as chips on each consumer instead of as lines into a hub,
# which is what made the old network graph unreadable.

appTypes:
  - type: ""
    shape: diamond
  - type: -api
